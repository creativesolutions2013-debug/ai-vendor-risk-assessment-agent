name: Vendor Assessment Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Validate assessment workflow
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run vendor assessment
        run: python app.py

      - name: Run automated tests
        run: python -m unittest discover -s tests -v

      - name: Confirm generated report is current
        run: git diff --exit-code outputs/sample-assessment.md