name: Vendor Assessment Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Validate assessment workflow
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser-interface dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate browser application syntax
        run: python -m py_compile web_app.py

      - name: Run rules-based vendor assessment
        run: python app.py

      - name: Run simulated AI assessment
        run: python ai_layer.py

      - name: Run automated tests
        run: python -m unittest discover -s tests -v

      - name: Confirm generated reports are current
        run: |
          git diff --exit-code outputs/sample-assessment.md
          git diff --exit-code outputs/ai-assisted-sample.md